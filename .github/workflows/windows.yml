name: Build windows

on:
    pull_request:
    push:
        branches:
            - main
            - dev
            - skyrimnet-bridge
    workflow_call:
        inputs:
            build-mode:
                required: false
                type: string
                default: releasedbg
            upload-build-for-next-job:
                required: false
                type: boolean
                default: false
            fetch_skyrimnet_header:
                required: false
                type: boolean
                default: true
    # SkyrimNet bridge: run by hand, optionally without the SkyrimNet header, to prove the build passes either way
    workflow_dispatch:
        inputs:
            fetch_skyrimnet_header:
                description: "Fetch SkyrimNet's CppAPI/PublicAPI.h from its release (off = build without it)"
                required: false
                type: boolean
                default: true

env:
    BUILD_MODE: ${{ inputs.build-mode || 'releasedbg' }}
    # SkyrimNet bridge: the SkyrimNet-GamePlugin release whose CppAPI/PublicAPI.h the build compiles against.
    # Maintainers: pin a tag (e.g. vbeta29-rc4) instead of "latest" so builds are reproducible.
    # The header is never committed (SkyrimNet's licence forbids redistribution); see docs/bridge/ci-skyrimnet-header.md.
    SKYRIMNET_RELEASE: latest

jobs:
    build:
        strategy:
            matrix:
                os: [windows-2022]
                arch: [x64]

        runs-on: ${{ matrix.os }}
        if: "!contains(github.event.head_commit.message, 'ci skip')"
        defaults:
            run:
                shell: bash

        steps:
            - uses: actions/checkout@v7
              with:
                  # We need full history in order to create a version string (BuildInfo.h)
                  fetch-depth: 0

            - name: Checkout submodules
              run: |
                  git submodule sync --recursive
                  git submodule update --init --force --recursive --depth=1

            - name: Checkout main on tag push
              if: github.ref_type == 'tag'
              run: |
                  test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
                  git checkout -B main HEAD

            - name: Resolve artifact version
              if: ${{ inputs.upload-build-for-next-job }}
              run: |
                  version="$(git describe --tags --always)"
                  echo "ARTIFACT_VERSION=${version#v}" >> "$GITHUB_ENV"

            - name: Cache xmake dependencies
              uses: actions/cache@v6
              with:
                  path: ~/AppData/Local/.xmake/packages
                  key: ${{ runner.os }}-xmake-${{ hashFiles('**/xmake.lua') }}
                  # Any xmake.lua edit changes the key; without a fallback every dependency was rebuilt from nothing
                  # (15 min on 2026-10-10). The newest earlier cache comes back instead and xmake builds only what changed.
                  restore-keys: |
                      ${{ runner.os }}-xmake-

            # Install xmake
            - name: Setup xmake
              uses: xmake-io/github-action-setup-xmake@v1
              with:
                  xmake-version: 3.1.0
                  actions-cache-folder: ".xmake-cache" # This doesn't cache dependencies, only xmake itself
                  actions-cache-key: ${{ matrix.os }}

            # SkyrimNet bridge: download SkyrimNet's release and extract only CppAPI/PublicAPI.h into the git-ignored
            # external/skyrimnet/. Code/client/xmake.lua defines SKYRIMNET_API_AVAILABLE when the file is there.
            # Push and pull_request runs have no inputs, so format() gives '' and the step runs; only an explicit false skips it.
            - name: Fetch SkyrimNet API header
              if: ${{ format('{0}', inputs.fetch_skyrimnet_header) != 'false' }}
              env:
                  GH_TOKEN: ${{ github.token }}
                  SKYRIMNET_REPO: MinLL/SkyrimNet-GamePlugin
              run: |
                  set -euo pipefail
                  if [ "$SKYRIMNET_RELEASE" = "latest" ]; then
                      # /releases/latest skips pre-releases; SkyrimNet may publish only those, so fall back to the newest one
                      release_json="$(gh api "repos/$SKYRIMNET_REPO/releases/latest" 2>/dev/null || gh api "repos/$SKYRIMNET_REPO/releases?per_page=1" --jq '.[0]')"
                  else
                      release_json="$(gh api "repos/$SKYRIMNET_REPO/releases/tags/$SKYRIMNET_RELEASE")"
                  fi
                  tag="$(jq -r '.tag_name // empty' <<<"$release_json")"
                  echo "SkyrimNet release: ${tag:-<none>} (SKYRIMNET_RELEASE=$SKYRIMNET_RELEASE)"
                  mapfile -t assets < <(jq -r '.assets[]? | .name' <<<"$release_json")
                  echo "Assets seen (${#assets[@]}):"
                  printf '  %s\n' "${assets[@]}"
                  if [ "${#assets[@]}" -eq 0 ]; then
                      echo "::error::SkyrimNet release '${tag:-$SKYRIMNET_RELEASE}' lists no assets"
                      exit 1
                  fi

                  # The main SkyrimNet archive: not Piper/voice/model packs; prefer a name starting with SkyrimNet
                  candidates="$(printf '%s\n' "${assets[@]}" | grep -iE '\.(zip|7z)$' | grep -viE 'piper|voice|model' || true)"
                  asset="$(grep -iE '^SkyrimNet' <<<"$candidates" | head -n1 || true)"
                  [ -n "$asset" ] || asset="$(head -n1 <<<"$candidates")"
                  if [ -z "$asset" ]; then
                      echo "::error::No SkyrimNet .zip/.7z asset found among the assets above"
                      exit 1
                  fi
                  url="$(jq -r --arg n "$asset" '.assets[] | select(.name == $n) | .browser_download_url' <<<"$release_json")"
                  echo "Downloading $asset"
                  dl="$RUNNER_TEMP/skyrimnet-release"
                  mkdir -p "$dl"
                  archive="$dl/$asset"
                  curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -o "$archive" "$url"

                  # PublicAPI.h may sit under CppAPI/ or SKSE/Plugins/SkyrimNet/CppAPI/; find it, prefer a CppAPI path
                  use_unzip=false
                  if [[ "$asset" =~ \.[zZ][iI][pP]$ ]] && command -v unzip >/dev/null; then use_unzip=true; fi
                  if $use_unzip; then
                      entries="$(unzip -Z1 "$archive")"
                  else
                      entries="$(7z l -slt "$archive" | sed -n 's/^Path = //p' | tail -n +2)"
                  fi
                  matches="$(grep -iE '(^|[/\\])PublicAPI\.h$' <<<"$entries" || true)"
                  entry="$(grep -iE 'CppAPI[/\\]' <<<"$matches" | head -n1 || true)"
                  [ -n "$entry" ] || entry="$(head -n1 <<<"$matches")"
                  if [ -z "$entry" ]; then
                      echo "::error::PublicAPI.h not found in $asset. Entries ending in .h:"
                      grep -iE '\.h$' <<<"$entries" || echo "  (none)"
                      exit 1
                  fi
                  echo "Found header at: $entry"
                  mkdir -p external/skyrimnet
                  if $use_unzip; then
                      unzip -p "$archive" "$entry" > external/skyrimnet/PublicAPI.h
                  else
                      7z e -so "$archive" "$entry" > external/skyrimnet/PublicAPI.h
                  fi
                  test -s external/skyrimnet/PublicAPI.h
                  rm -rf "$dl"
                  sha="$(sha256sum external/skyrimnet/PublicAPI.h | cut -d' ' -f1)"
                  echo "external/skyrimnet/PublicAPI.h from $tag/$asset:$entry (sha256 $sha)"
                  echo "SkyrimNet header: \`$entry\` from \`$asset\` (release \`$tag\`), sha256 \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

            - name: Configure xmake and install dependencies
              run: xmake config --plat=windows --arch=${{ matrix.arch }} --mode="$BUILD_MODE" --yes -vD

            # Build the client
            # A push builds what urSovngarde ships, as release.yml does: the VR client (through its launcher), the
            # server, the menu's process and the tests. Upstream's flat-Skyrim client is never shipped and took about
            # half of the 21 minutes `xmake -y` needed (2026-10-10). The playable-build packaging below still wants
            # everything, so it keeps the full build.
            - name: Build with xmake
              run: |
                  if [ "${{ inputs.upload-build-for-next-job }}" = "true" ]; then
                      xmake -y
                  else
                      xmake build -y SkyrimImmersiveLauncherVR
                      xmake build -y SkyrimServerRunner
                      xmake build -y TPProcess
                      xmake build -y TPTests
                  fi
                  echo "STR_BUILD_DIR=build/windows/${{ matrix.arch }}/${BUILD_MODE}/" >> "$GITHUB_ENV"

            # The encoding round trips and the rest of TPTests
            - name: Run tests
              run: xmake run TPTests

            # Create distrib
            - name: Output distrib binaries via xmake
              run: |
                  if [ "${{ inputs.upload-build-for-next-job }}" = "true" ]; then
                      xmake install -o distrib
                  else
                      xmake install -o distrib SkyrimTogetherClientVR
                      xmake install -o distrib TPProcess
                  fi
                  cp -rf distrib/bin/* "$STR_BUILD_DIR"

            # Building the Together UI

            - name: Setup pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 9

            - name: Setup Node
              uses: actions/setup-node@v7
              with:
                  node-version: lts/iron
                  cache-dependency-path: Code/skyrim_ui/pnpm-lock.yaml
                  cache: pnpm

            - name: Build the UI
              run: |
                  pnpm --prefix Code/skyrim_ui/ install
                  pnpm --prefix Code/skyrim_ui/ deploy:production
                  cp -r Code/skyrim_ui/dist/UI "$STR_BUILD_DIR"

            - name: Package build and organize directories
              if: ${{ inputs.upload-build-for-next-job }}
              run: |
                  mkdir -p str-build/SkyrimTogetherReborn str-pdb
                  mv "$STR_BUILD_DIR"/* str-build/SkyrimTogetherReborn/
                  cp -r GameFiles/Skyrim/* str-build/

            - name: Remove unnecessary build files, keep .pdb
              if: ${{ inputs.upload-build-for-next-job }}
              run: |
                  mv str-build/SkyrimTogetherReborn/SkyrimTogether.pdb str-pdb/
                  mv str-build/SkyrimTogetherReborn/SkyrimTogetherServer.pdb str-pdb/
                  rm -f str-build/SkyrimTogetherReborn/*.pdb str-build/SkyrimTogetherReborn/*.lib str-build/SkyrimTogetherReborn/*.exp
                  rm -f str-build/SkyrimTogetherReborn/*Tests.exe

            - name: Create Windows release zips
              if: ${{ inputs.upload-build-for-next-job }}
              run: |
                  mkdir -p release-assets
                  (cd str-build && 7z a -tzip \
                    "../release-assets/SkyrimTogether-${ARTIFACT_VERSION}-windows-${{ matrix.arch }}.zip" \
                    .)
                  (cd str-pdb && 7z a -tzip \
                    "../release-assets/SkyrimTogether-${ARTIFACT_VERSION}-windows-${{ matrix.arch }}-debug-symbols.zip" \
                    .)

            - name: Upload playable build
              if: ${{ inputs.upload-build-for-next-job }}
              uses: actions/upload-artifact@v7
              with:
                  name: SkyrimTogether-${{ env.ARTIFACT_VERSION }}-windows-${{ matrix.arch }}
                  # Direct downloads should receive the existing zip without another zip layer
                  archive: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
                  retention-days: 7
                  if-no-files-found: error
                  path: release-assets/SkyrimTogether-${{ env.ARTIFACT_VERSION }}-windows-${{ matrix.arch }}.zip

            - name: Upload debug symbols
              if: ${{ inputs.upload-build-for-next-job }}
              uses: actions/upload-artifact@v7
              with:
                  name: SkyrimTogether-${{ env.ARTIFACT_VERSION }}-windows-${{ matrix.arch }}-debug-symbols
                  # Direct downloads should receive the existing zip without another zip layer
                  archive: ${{ github.event_name == 'push' && github.ref_type == 'tag' }}
                  retention-days: 7
                  if-no-files-found: error
                  path: release-assets/SkyrimTogether-${{ env.ARTIFACT_VERSION }}-windows-${{ matrix.arch }}-debug-symbols.zip
